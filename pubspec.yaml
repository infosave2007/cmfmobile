name: cmf_mobile
description: "CMF Mobile — run local AI models on your phone, serve them over the CMF protocol, and convert models from Hugging Face."
publish_to: 'none'

version: 1.0.4+5

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  shared_preferences: ^2.5.5
  path_provider: ^2.1.6
  http: ^1.6.0
  qr_flutter: ^4.1.0
  intl: ^0.20.2
  ffi: ^2.2.0
  network_info_plus: ^7.0.0
  flutter_markdown: ^0.7.7+1
  device_info_plus: ^12.1.0
  file_picker: ">=10.0.0 <11.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
