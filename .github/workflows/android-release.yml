name: Android Play Release

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "versionCode (целое число), например 49"
        required: true
        default: "49"
      track:
        description: "Трек Play: internal | alpha | beta | production"
        required: true
        default: "internal"

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.1"
          channel: stable
          cache: true

      - uses: ./.github/actions/native-runtime
        with:
          platform: android

      - name: Restore upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$HOME/upload.jks"

      - name: Build AAB
        env:
          KEYSTORE_PATH: /home/runner/upload.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: cmf
          KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          flutter pub get
          flutter build appbundle --release --build-number="${{ inputs.build_number }}"

      - uses: actions/upload-artifact@v4
        with:
          name: play-aab
          path: build/app/outputs/bundle/release/app-release.aab

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ai.cortiq.cmf_mobile
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: ${{ inputs.track }}
          status: completed

      - name: Verify store processing
        env:
          BUILD_NUMBER: ${{ inputs.build_number }}
          PLAY_TRACK: ${{ inputs.track }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          python3 -m venv "$RUNNER_TEMP/store-verify"
          "$RUNNER_TEMP/store-verify/bin/pip" install -r scripts/store-requirements.txt
          "$RUNNER_TEMP/store-verify/bin/python" scripts/verify_store.py google
