name: iOS App Store Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      build_number:
        description: "Номер сборки (CFBundleVersion), например 1.1.22"
        required: true
        default: "1.1.22"

jobs:
  build-and-upload:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
      # По тегу vX.Y.Z номер сборки берётся из тега; вручную — из инпута.
      BUILD_NUMBER: ${{ inputs.build_number || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Select newest stable Xcode on runner
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos || true
          sw_vers

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.1"
          channel: stable
          cache: true

      - name: Install App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          mkdir -p ~/private_keys
          printf '%s' "$ASC_KEY_P8" > ~/private_keys/AuthKey_${ASC_KEY_ID}.p8

      - name: Build Flutter app (no codesign)
        run: |
          flutter pub get
          flutter build ios --release --no-codesign --build-number="${BUILD_NUMBER#v}"

      - name: Archive with cloud signing
        run: |
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/Runner.xcarchive" archive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID 69a6de97-8c6a-47e3-e053-5b8c7c11a4d1

      - name: Export signed IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath "$PWD/build/Runner.xcarchive" \
            -exportOptionsPlist ios/ExportOptionsCI.plist \
            -exportPath "$PWD/build/ipa" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID 69a6de97-8c6a-47e3-e053-5b8c7c11a4d1

      - name: Verify IPA metadata
        run: |
          cd build/ipa
          unzip -o -q *.ipa "Payload/Runner.app/Info.plist"
          plutil -p Payload/Runner.app/Info.plist | grep -E "DTXcode|DTSDK|DTPlatform|BuildMachine|CFBundleVersion"

      - name: Upload to App Store Connect
        run: |
          xcrun altool --upload-app --type ios -f build/ipa/*.ipa \
            --apiKey ${ASC_KEY_ID} \
            --apiIssuer 69a6de97-8c6a-47e3-e053-5b8c7c11a4d1
