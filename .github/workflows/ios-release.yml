name: iOS App Store Release

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "Номер сборки (CFBundleVersion), например 1.1.22"
        required: true
        default: "1.1.22"

jobs:
  build-and-upload:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Select newest stable Xcode on runner
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos || true
          sw_vers

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.1"
          channel: stable
          cache: true

      - name: Install App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          mkdir -p ~/private_keys
          printf '%s' "$ASC_KEY_P8" > ~/private_keys/AuthKey_${ASC_KEY_ID}.p8

      - name: Import signing certificate
        env:
          IOS_DIST_P12: ${{ secrets.IOS_DIST_P12 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
        run: |
          KEYCHAIN_PASS=$(openssl rand -hex 16)
          security create-keychain -p "$KEYCHAIN_PASS" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASS" build.keychain
          printf '%s' "$IOS_DIST_P12" | openssl base64 -d -A > cert.p12
          security import cert.p12 -k build.keychain -P "$IOS_P12_PASSWORD" -A -t cert -f pkcs12
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASS" build.keychain
          security list-keychains -d user -s build.keychain login.keychain
          rm cert.p12
          security find-identity -v -p codesigning build.keychain

      - name: Install provisioning profile
        env:
          IOS_PROFILE: ${{ secrets.IOS_PROVISION_PROFILE }}
        run: |
          printf '%s' "$IOS_PROFILE" | openssl base64 -d -A > profile.mobileprovision
          UUID=$(security cms -D -i profile.mobileprovision | plutil -extract UUID raw -o - -)
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles" \
                   "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          cp profile.mobileprovision "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          cp profile.mobileprovision "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$UUID.mobileprovision"
          rm profile.mobileprovision

      - name: Build Flutter app (no codesign)
        run: |
          flutter pub get
          flutter build ios --release --no-codesign --build-number="${{ inputs.build_number }}"

      - name: Archive with manual signing
        run: |
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/Runner.xcarchive" archive \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=Z8KN74A8F2 \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="iOS Team Store Provisioning Profile: ai.cortiq.cmfMobile"

      - name: Export signed IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath "$PWD/build/Runner.xcarchive" \
            -exportOptionsPlist ios/ExportOptionsCI.plist \
            -exportPath "$PWD/build/ipa"

      - name: Verify IPA metadata
        run: |
          cd build/ipa
          unzip -o -q *.ipa "Payload/Runner.app/Info.plist"
          plutil -p Payload/Runner.app/Info.plist | grep -E "DTXcode|DTSDK|DTPlatform|BuildMachine|CFBundleVersion"

      - name: Upload to App Store Connect
        run: |
          xcrun altool --upload-app --type ios -f build/ipa/*.ipa \
            --apiKey ${ASC_KEY_ID} \
            --apiIssuer 69a6de97-8c6a-47e3-e053-5b8c7c11a4d1
