name: Release

# Push a tag like v1.0.0 → builds the Android APKs and an unsigned iOS
# archive and attaches them to the GitHub Release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter gen-l10n
      - run: flutter analyze
      - run: flutter test

      - name: Build APKs
        run: |
          flutter build apk --release
          flutter build apk --release --split-per-abi

      - name: Rename artifacts
        run: |
          cd build/app/outputs/flutter-apk
          mv app-release.apk cmf-mobile-${{ github.ref_name }}-universal.apk
          mv app-arm64-v8a-release.apk cmf-mobile-${{ github.ref_name }}-arm64-v8a.apk
          mv app-armeabi-v7a-release.apk cmf-mobile-${{ github.ref_name }}-armeabi-v7a.apk
          mv app-x86_64-release.apk cmf-mobile-${{ github.ref_name }}-x86_64.apk

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            build/app/outputs/flutter-apk/cmf-mobile-*.apk

  ios:
    name: iOS (unsigned)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter gen-l10n

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign

      # A hollow build (runtime not linked) must fail loudly, not ship.
      - name: Verify cortiq runtime is linked
        run: |
          BIN=build/ios/iphoneos/Runner.app/Runner
          if dyld_info -exports "$BIN" 2>/dev/null | grep -q _cortiq_load \
             || nm -gU "$BIN" 2>/dev/null | grep -q _cortiq_load; then
            echo "cortiq symbols present"
          else
            echo "::error::cortiq_ffi is not linked into Runner"
            exit 1
          fi

      # Unsigned .ipa: install via AltStore/Sideloadly or sign with your
      # own certificate; App Store builds need Xcode signing set up.
      - name: Package unsigned ipa
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -qry cmf-mobile-${{ github.ref_name }}-unsigned.ipa Payload

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: cmf-mobile-*-unsigned.ipa
